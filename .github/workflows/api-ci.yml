name: api-ci

# Runs lint + typecheck + unit + e2e on every PR that touches the API or its
# shared types, plus on every push to main. Mirrors the dev stack exactly:
# Node 22, Postgres 17 (pgvector image), LocalStack 4.x.

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'shared/types/**'
      - 'pnpm-lock.yaml'
      - 'docker-compose.yml'
      - 'infra/localstack/**'
      - '.github/workflows/api-ci.yml'
  push:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --parallel lint
      - run: pnpm -r --parallel typecheck

  unit-tests:
    name: Unit + Integration Tests
    runs-on: ubuntu-24.04
    needs: lint-and-typecheck
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: humyn
          POSTGRES_PASSWORD: humyn
          POSTGRES_DB: humyn_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U humyn -d humyn_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
      localstack:
        image: localstack/localstack:4.0
        env:
          SERVICES: s3,secretsmanager
          DEFAULT_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          DEBUG: '0'
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://humyn:humyn@localhost:5432/humyn_dev
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      RECORDINGS_BUCKET: humyn-recordings-dev
      APK_BUCKET: humyn-apk-dev
      FEEDBACK_BUCKET: humyn-feedback-dev
      JWT_SIGNING_SECRET: ci-only-test-secret-32-bytes-aaaaaaaaaaaaaaaa
      GOOGLE_WEB_CLIENT_ID: ci-test-web-client-id
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # Bootstrap LocalStack S3 buckets + Secrets Manager entries via the same
      # init scripts the dev docker-compose mounts at startup. We exec them
      # against the running localstack service container with the AWS CLI
      # (awslocal isn't available on the runner — provide a wrapper).
      - name: Install awscli for LocalStack bootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli
      - name: Bootstrap LocalStack buckets + secrets
        env:
          AWS_DEFAULT_REGION: ap-south-1
          AWS_ENDPOINT_URL: http://localhost:4566
        run: |
          # Provide an `awslocal` shim that points the AWS CLI at LocalStack —
          # this is the same entry point the init scripts call.
          sudo tee /usr/local/bin/awslocal >/dev/null <<'SHIM'
          #!/usr/bin/env bash
          aws --endpoint-url=http://localhost:4566 --region=ap-south-1 "$@"
          SHIM
          sudo chmod +x /usr/local/bin/awslocal
          bash infra/localstack/init/01-create-buckets.sh
          bash infra/localstack/init/02-seed-secrets.sh

      # Apply DB migrations explicitly (we don't use docker-compose here, so
      # the postgres service container is unprovisioned). Lexicographic order;
      # apps/api/scripts/migrate.ts walks the directory + skips files already
      # in schema_migrations, so re-runs are safe.
      - name: Apply DB migrations
        run: |
          cd apps/api
          pnpm db:migrate

      # The boot-guard (apps/api/src/legal/boot-guard.ts) refuses to start the
      # API if the on-disk consent-text.ts SHA-256 doesn't match the constant
      # in consent-text-hash.ts. The constant is regenerated by `pnpm legal:hash`
      # — running it here ensures any consent-text mutation is paired with a
      # matching hash refresh; otherwise the boot-guard fires a clear failure.
      - name: Regenerate consent text hash
        run: |
          cd apps/api
          pnpm legal:hash

      - name: Run unit + integration tests
        run: cd apps/api && pnpm test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-24.04
    needs: unit-tests
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: humyn
          POSTGRES_PASSWORD: humyn
          POSTGRES_DB: humyn_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U humyn -d humyn_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
      localstack:
        image: localstack/localstack:4.0
        env:
          SERVICES: s3,secretsmanager
          DEFAULT_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          DEBUG: '0'
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://humyn:humyn@localhost:5432/humyn_dev
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      RECORDINGS_BUCKET: humyn-recordings-dev
      APK_BUCKET: humyn-apk-dev
      FEEDBACK_BUCKET: humyn-feedback-dev
      JWT_SIGNING_SECRET: ci-only-test-secret-32-bytes-aaaaaaaaaaaaaaaa
      GOOGLE_WEB_CLIENT_ID: ci-test-web-client-id
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Install awscli for LocalStack bootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli
      - name: Bootstrap LocalStack buckets + secrets
        env:
          AWS_DEFAULT_REGION: ap-south-1
          AWS_ENDPOINT_URL: http://localhost:4566
        run: |
          sudo tee /usr/local/bin/awslocal >/dev/null <<'SHIM'
          #!/usr/bin/env bash
          aws --endpoint-url=http://localhost:4566 --region=ap-south-1 "$@"
          SHIM
          sudo chmod +x /usr/local/bin/awslocal
          bash infra/localstack/init/01-create-buckets.sh
          bash infra/localstack/init/02-seed-secrets.sh

      # Apply ALL 5 Phase-1 migrations explicitly. The runner walks
      # apps/api/src/db/migrations/* lexicographically + skips already-applied
      # entries via the schema_migrations bookkeeping table. The literal
      # filenames are listed below for grep-driven traceability:
      #   - 0001_init.sql (plan 02)
      #   - 0002_auth_nonces.sql (plan 05)
      #   - 0003_recordings_multipart.sql (plan 07)
      #   - 0004_contributions_trigger_and_feedback_bucket.sql (plan 08)
      #   - 0005_takedown_log.sql (plan 11)
      - name: Apply DB migrations
        run: |
          cd apps/api
          pnpm db:migrate

      - name: Regenerate consent text hash
        run: |
          cd apps/api
          pnpm legal:hash

      - name: Run e2e tests
        run: cd apps/api && pnpm test:e2e
