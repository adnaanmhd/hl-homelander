version: 0.2

env:
  variables:
    ANDROID_HOME: "/usr/local/android-sdk"
    ANDROID_SDK_ROOT: "/usr/local/android-sdk"
    FIREBASE_APP_ID: "1:215168406627:android:206ded8adc129a383fd456"
  secrets-manager:
    GOOGLE_SERVICES_JSON_BASE64: "stage-hl-mobile-build:GOOGLE_SERVICES_JSON_BASE64"
    APK_ROLLOUT_KEYSTORE_BASE64: "stage-hl-mobile-build:APK_ROLLOUT_KEYSTORE_BASE64"
    APK_ROLLOUT_KEYSTORE_PASSWORD: "stage-hl-mobile-build:APK_ROLLOUT_KEYSTORE_PASSWORD"
    APK_ROLLOUT_KEY_ALIAS: "stage-hl-mobile-build:APK_ROLLOUT_KEY_ALIAS"
    APK_ROLLOUT_KEY_PASSWORD: "stage-hl-mobile-build:APK_ROLLOUT_KEY_PASSWORD"
    FIREBASE_SERVICE_ACCOUNT_JSON: "stage-hl-mobile-build:FIREBASE_SERVICE_ACCOUNT_JSON"

phases:
  install:
    runtime-versions:
      java: corretto17
      nodejs: 22
    commands:
      - echo "Installing Android SDK Command Line Tools..."
      - mkdir -p ${ANDROID_HOME}/cmdline-tools
      - if [ ! -d "${ANDROID_HOME}/cmdline-tools/latest" ]; then curl -sS https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip && unzip -q /tmp/cmdline-tools.zip -d ${ANDROID_HOME}/cmdline-tools && mv ${ANDROID_HOME}/cmdline-tools/cmdline-tools ${ANDROID_HOME}/cmdline-tools/latest; fi
      - export PATH=${PATH}:${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools
      - yes | sdkmanager --licenses > /dev/null
      - sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - echo "Installing Firebase CLI..."
      - npm install -g firebase-tools
      - echo "Installing shared types and mobile deps..."
      - cd $CODEBUILD_SRC_DIR/shared/types && npm install && npm run build
      - cd $CODEBUILD_SRC_DIR/apps/mobile && npm ci

  pre_build:
    commands:
      - echo "Decoding google-services.json from secret..."
      - echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > $CODEBUILD_SRC_DIR/apps/mobile/android/app/google-services.json
      - echo "Decoding APK Rollout keystore from secret..."
      - echo "$APK_ROLLOUT_KEYSTORE_BASE64" | base64 -d > /tmp/apkrollout.keystore
      - echo "Writing Firebase service account..."
      - echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
      - echo "Setting signing env vars..."
      - export APK_ROLLOUT_KEYSTORE_PATH=/tmp/apkrollout.keystore
      - export PATH=${PATH}:${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools

  build:
    commands:
      - echo "Running unit tests and assembling apkRollout release APK..."
      - cd $CODEBUILD_SRC_DIR/apps/mobile/android && APK_ROLLOUT_KEYSTORE_PATH=/tmp/apkrollout.keystore ./gradlew :app:testApkRolloutReleaseUnitTest assembleApkRolloutRelease

  post_build:
    commands:
      - echo "Verifying merged manifests..."
      - cd $CODEBUILD_SRC_DIR/apps/mobile && bash scripts/verify-merged-manifests.sh Release
      - APK_PATH=$CODEBUILD_SRC_DIR/apps/mobile/android/app/build/outputs/apk/apkRollout/release/app-apkRollout-release.apk
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:0:8}
      - echo "Uploading APK to S3..."
      - aws s3 cp $APK_PATH s3://humyn-apk-stage/apks/app-apkRollout-staging-${IMAGE_TAG}.apk
      - aws s3 cp $APK_PATH s3://humyn-apk-stage/apks/app-apkRollout-staging-latest.apk
      - echo "Distributing via Firebase App Distribution..."
      - firebase appdistribution:distribute $APK_PATH --app $FIREBASE_APP_ID --service-credentials-file /tmp/firebase-sa.json --release-notes "Build ${IMAGE_TAG} from stage"

cache:
  paths:
    - '/usr/local/android-sdk/**/*'
    - '/root/.gradle/**/*'
    - 'shared/types/node_modules/**/*'
    - 'apps/mobile/node_modules/**/*'
