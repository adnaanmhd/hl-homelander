# Robolectric SDK pin for the apps/mobile JVM unit-test harness.
# compileSdk/targetSdk are 36 (required by react-native-screens 4.24+ on
# RN 0.83), but Robolectric 4.16's SDK 36 sandbox needs Java 21 to run.
# Pin to API 33 — the highest level whose sandbox runs cleanly on JDK 17,
# matches the per-class `@Config(sdk = [33])` already used by EncoderProbe
# + NalParser tests, and is sufficient for our compat-probe assertions
# (Camera2/Sensor APIs we touch were stable from API 26+).
sdk=33
application=android.app.Application
