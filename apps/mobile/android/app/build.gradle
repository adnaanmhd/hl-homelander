apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
// Must come after com.google.gms.google-services. Injects the Crashlytics
// build-id resource that @react-native-firebase/crashlytics reads on init.
apply plugin: "com.google.firebase.crashlytics"

// react-native-config flavor → env-file mapping. The plugin's `dotenv.gradle`
// reads the chosen file and emits each KEY=VALUE pair as both a build-time
// `resValue` string (so `Config.<KEY>` works at runtime) and a BuildConfig
// field. The map MUST be set before the `apply from` call below; the plugin
// looks at variant.flavorName.toLowerCase() to pick a key, so use lowercase
// keys here that match the lowercased flavor name.
project.ext.envConfigFiles = [
    apkrolloutdebug: ".env.apkRollout",
    apkrolloutrelease: ".env.apkRollout",
    playstoredebug: ".env.playStore",
    playstorerelease: ".env.playStore",
    apkrollout: ".env.apkRollout",
    playstore: ".env.playStore",
]
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

// React Native gradle plugin app-level autolinking. Settings-level
// `autolinkLibrariesFromCommand()` generates PackageList.java + JNI codegen,
// but `autolinkLibrariesWithApp()` is what translates the autolinked native
// modules into `implementation project(":...")` dependencies on the app
// classpath. Without this, javac fails to resolve RNPermissionsPackage,
// ReanimatedPackage, SafeAreaContextPackage, RNScreensPackage, SvgPackage,
// etc. (Issue surfaces at first APK bundle for Phase 2; Phase 1 was
// backend-only.)
react {
    autolinkLibrariesWithApp()
}

android {
    namespace 'ai.humynlabs.capture'
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        // Default applicationId is overridden per-flavor below; this value is the
        // canonical Play Store id and acts as a defensive fallback only.
        applicationId 'ai.humynlabs.capture'
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode (project.hasProperty('humynVersionCode')
                     ? project.humynVersionCode.toInteger() : 1)
        versionName (project.hasProperty('humynVersionName')
                     ? project.humynVersionName : '0.1.0')
        // react-native-config's native module reflects into <pkg>.BuildConfig
        // to expose .env values to JS via `import Config from 'react-native-config'`.
        // The "build_config_package" resValue tells the module which package to
        // probe; without it logcat says "ReactConfig: Could not find BuildConfig class"
        // and every Config.<KEY> read returns undefined at runtime.
        resValue "string", "build_config_package", "ai.humynlabs.capture"
    }

    flavorDimensions += 'distribution'

    productFlavors {
        playStore {
            dimension 'distribution'
            // D-FLAV-01: canonical, permanent applicationId on Play Store.
            applicationId 'ai.humynlabs.capture'
            versionNameSuffix ''
            buildConfigField 'String', 'FLAVOR_NAME', '"playStore"'
            buildConfigField 'String', 'APPLICATION_ID', '"ai.humynlabs.capture"'
            // Play Integrity Classic API: required by IntegrityTokenRequest.setCloudProjectNumber(...)
            // when the package is not auto-attributed via Play Console linkage. The playStore
            // flavor would normally be auto-attributed once published, but we set it explicitly
            // so the call site is uniform across flavors and Play-Console linkage state cannot
            // silently regress us. Source of the number: GCP Console → Project info → Project
            // number for project 'humyn-prod' (matches the prefix of GOOGLE_WEB_CLIENT_ID in
            // .env.playStore). Read via BuildConfig.GOOGLE_CLOUD_PROJECT_NUMBER in
            // io.humyn.app.PlayIntegrityModule. The trailing 'L' makes this a Java long literal
            // (Play Integrity setter signature is setCloudProjectNumber(Long)).
            buildConfigField 'long', 'GOOGLE_CLOUD_PROJECT_NUMBER', '130483521533L'
        }
        apkRollout {
            dimension 'distribution'
            // D-FLAV-01: `.apk` suffix lets the apkRollout build co-install with playStore
            // and is the wire-side identifier the server allowlist (plan 05) cross-checks.
            applicationId 'ai.humynlabs.capture.apk'
            versionNameSuffix '-apk'
            buildConfigField 'String', 'FLAVOR_NAME', '"apkRollout"'
            buildConfigField 'String', 'APPLICATION_ID', '"ai.humynlabs.capture.apk"'
            // Play Integrity Classic API: REQUIRED for this flavor — the apkRollout package
            // (ai.humynlabs.capture.apk, D-FLAV-01 / D-DIST-01) is intentionally never
            // registered in Play Console (it's the sideload distribution flavor that ships
            // before Play Store). Without this number the Integrity API has no project to
            // attribute the request to and fails with -16 CLOUD_PROJECT_NUMBER_IS_INVALID.
            // Same project number as the playStore flavor (single GCP project hosts both
            // OAuth client + Play Integrity).
            buildConfigField 'long', 'GOOGLE_CLOUD_PROJECT_NUMBER', '130483521533L'
        }
        // NOTE: Two flavors only. DIST-07 (third-flavor recon build) is rescinded per
        // CONTEXT.md D-DIST-01. iOS distribution is an Xcode scheme target, not an Android
        // product flavor; Phase 7 wires that separately.
    }

    signingConfigs {
        playStoreRelease {
            storeFile file(System.getenv('PLAY_STORE_KEYSTORE_PATH')
                           ?: "${rootProject.projectDir}/keystores/playstore.keystore")
            storePassword System.getenv('PLAY_STORE_KEYSTORE_PASSWORD')
            keyAlias System.getenv('PLAY_STORE_KEY_ALIAS')
            keyPassword System.getenv('PLAY_STORE_KEY_PASSWORD')
        }
        apkRolloutRelease {
            storeFile file(System.getenv('APK_ROLLOUT_KEYSTORE_PATH')
                           ?: "${rootProject.projectDir}/keystores/apkrollout.keystore")
            storePassword System.getenv('APK_ROLLOUT_KEYSTORE_PASSWORD')
            keyAlias System.getenv('APK_ROLLOUT_KEY_ALIAS')
            keyPassword System.getenv('APK_ROLLOUT_KEY_PASSWORD')
        }
    }

    buildTypes {
        debug {
            // Both flavors use the standard Android debug keystore in dev.
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            productFlavors.playStore.signingConfig signingConfigs.playStoreRelease
            productFlavors.apkRollout.signingConfig signingConfigs.apkRolloutRelease
        }
    }

    buildFeatures {
        buildConfig true
    }

    // Debug session handgate-never-passes (2026-05-11) — the bundled MediaPipe
    // model bundle `assets/hand_landmarker.task` (~7.8 MB) MUST be stored
    // UNCOMPRESSED in the APK. MediaPipe Tasks' BaseOptions.setModelAssetPath(...)
    // loads the bundle via AssetManager.openFd() / memory-map, which only works
    // on a STORED (not Deflate-compressed) asset; a compressed `.task` makes
    // HandLandmarker.createFromOptions(...) throw ("this file can not be opened
    // as a file descriptor; it is probably compressed"). AGP compresses `.task`
    // by default (it is not in AGP's built-in no-compress list), which silently
    // broke the pre-record hand gate from the very first APK build. `.tflite` is
    // added alongside for any future on-device model. Verify post-build:
    // `adb pull <base.apk>` then `unzip -lv` must show `Stored` (not `Defl:N`)
    // for `assets/hand_landmarker.task`. This change only takes effect on a
    // fresh build of the APK.
    androidResources {
        noCompress += ["task", "tflite"]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    // Plan 02-02 Task 2 — Robolectric harness for Kotlin native-module tests.
    // Plans 02-06+ drop Robolectric tests under android/app/src/test/.
    // includeAndroidResources lets Robolectric resolve our resources / assets
    // (notably the bundled hand_landmarker.task in plan 4 work and the HEVC
    // NAL fixtures in 02-12).
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    }
    // Plan 13 — Google Play Integrity SDK (com.google.android.play.core.integrity.IntegrityManager).
    // Wrapped by io.humyn.app.PlayIntegrityModule (Kotlin TurboModule) and exposed to RN as
    // NativeModules.PlayIntegrity.requestIntegrityToken(nonce). Server-side decode in plan 05.
    implementation 'com.google.android.play:integrity:1.4.0'

    // Plan 03-04 — Phase 3 fragmented MP4 muxer (CAP-02).
    // androidx.media3:media3-muxer ships FragmentedMp4Muxer with periodic
    // moov-flush via setFragmentDurationMs(); the stock android.media.MediaMuxer
    // does NOT support fragmented MP4 (RESEARCH.md Pitfall 1). Wrapped by
    // ai.humynlabs.capture.capture.FragmentedMuxerWrapper which keeps the
    // existing Phase-2 EncoderProbe encoder→muxer pump shape while routing
    // through the new Muxer interface. media3-common (1.10.0) and
    // media3-container (1.10.0) come in transitively as compile/runtime deps
    // of media3-muxer per its POM (verified 2026-05-10 via
    // https://dl.google.com/dl/android/maven2/androidx/media3/media3-muxer/1.10.0/media3-muxer-1.10.0.pom).
    implementation 'androidx.media3:media3-muxer:1.10.0'

    // Plan 04-02 — HAND-01: MediaPipe HandLandmarker for the pre-record hand gate.
    // Wrapped by ai.humynlabs.capture.handdetector.HumynHandDetectorModule (Kotlin
    // TurboModule, body in plan 04-04). The model bundle ships at
    // android/app/src/main/assets/hand_landmarker.task (~7.8 MB). Pinned at 0.10.21
    // for iOS-pod parity per CLAUDE.md — the MediaPipeTasksVision iOS pod 0.10.33+
    // has XCFramework linking issues (mediapipe #6258), so both sides stay at 0.10.21.
    // Artifact lives on Google Maven (google()), released 2025-01-31 — NOT Maven Central.
    // NOTE: the model asset MUST be packaged uncompressed — see `androidResources {
    // noCompress }` above (debug session handgate-never-passes, 2026-05-11).
    implementation 'com.google.mediapipe:tasks-vision:0.10.21'

    // Debug session handgate-never-passes (2026-05-11) — HumynHandDetectorModule
    // honors the EXIF Orientation tag on VisionCamera takePhoto() JPEGs (a cheap
    // defensive guard: a no-op when the tag is ORIENTATION_NORMAL, which is what
    // the Pixel 10a landscape-locked sensor writes, but protects devices/paths
    // whose sensor JPEG DOES carry a rotation tag, since HandLandmarker
    // RunningMode.IMAGE assumes an upright image). Use the AndroidX ExifInterface,
    // NOT android.media.ExifInterface (the platform class has narrower tag
    // coverage and a history of mishandling some OEM JPEGs). Pinned at 1.3.2 to
    // match the version already on the androidx compile classpath transitively.
    implementation 'androidx.exifinterface:exifinterface:1.3.2'

    // Plan 03-09 — D-SEG-01: read `capture.segment_minutes` from Firebase Remote Config
    // in Kotlin (`SegmentDurationConfig.kt`) + set defaults in `MainApplication.onCreate`.
    // The autolinked `:react-native-firebase_remote-config` module declares
    // `com.google.firebase:firebase-config` as `implementation` (not `api`), so the
    // dep doesn't propagate to the app's compile classpath. The Firebase BOM is
    // imported from the autolinked `:react-native-firebase_app` module's classpath
    // (via the same v34.10.0 BOM the JS bridge uses); pinning here keeps the
    // version single-sourced.
    implementation platform('com.google.firebase:firebase-bom:34.10.0')
    implementation 'com.google.firebase:firebase-config'

    // Plan 02-02 Task 2 — Robolectric harness. JVM unit tests for our Kotlin
    // native modules (HumynCompat, HumynCapture, HandDetector, ...) run on
    // the host JVM with shadowed Camera2/SensorManager/StatFs frameworks.
    // Pinned per .planning/phases/02-…/02-PATTERNS.md (lines 793-798).
    testImplementation 'junit:junit:4.13.2'
    // Robolectric 4.13 only ships SDK shadows up to API 34; bumped to 4.16.1
    // to cover compileSdk/targetSdk 36 for RN 0.83 + screens 4.24+.
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
}

// Autolinking is handled by `com.facebook.react.settings`'s `autolinkLibrariesFromCommand()`
// in settings.gradle (RN 0.71+ pattern). The legacy `native_modules.gradle` apply was removed.
