org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# `org.gradle.java.home` was previously hardcoded to a macOS Temurin path,
# which silently red-CI'd `android-build` on every Linux runner. Gradle
# resolves the JDK from `JAVA_HOME` (set by `actions/setup-java@v4` in CI;
# set by `/usr/libexec/java_home` or your shell on macOS) when this
# property is absent. Local devs who need a pinned JDK can drop the line
# into their per-user `~/.gradle/gradle.properties` instead of committing
# it here.
android.useAndroidX=true
hermesEnabled=true
newArchEnabled=true
android.suppressUnsupportedCompileSdk=35
android.nonTransitiveRClass=true
