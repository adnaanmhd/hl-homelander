// Root Gradle build script for the Humyn Labs Capture Android app.
// Pinned per CLAUDE.md / STACK.md: AGP 8.7+, Kotlin 2.0.21+, compileSdk 36, minSdk 26, JDK 17.
// compileSdk bumped 35 → 36 because react-native-screens 4.24+ (the version
// stream that compiles against RN 0.83) requires it. This is a SDK
// header-only bump for compilation; targetSdk also moved to 36 to match.

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        kotlinVersion = "2.0.21"
        agpVersion = "8.7.3"
        // Matches react-native@0.83 gradle/libs.versions.toml. Avoids AGP default
        // 27.0.12077973 when that SDK folder is missing or a partial install.
        ndkVersion = "27.1.12297006"
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:${agpVersion}")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
        classpath("com.google.gms:google-services:4.4.4")
        // Required by @react-native-firebase/crashlytics: the Crashlytics
        // Gradle plugin injects the build-id resource that FirebaseCrashlytics
        // .init() reads at app launch — without it the app crashes on start
        // ("The Crashlytics build ID is missing").
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.6")
    }
}

plugins {
    id "com.facebook.react.rootproject"
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url("https://www.jitpack.io") }
    }
}
