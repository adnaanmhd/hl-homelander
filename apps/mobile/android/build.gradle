// Root Gradle build script for the Humyn Labs Capture Android app.
// Pinned per CLAUDE.md / STACK.md: AGP 8.7+, Kotlin 2.0.21+, compileSdk 35, minSdk 26, JDK 17.

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 26
        compileSdkVersion = 35
        targetSdkVersion = 35
        kotlinVersion = "2.0.21"
        agpVersion = "8.7.3"
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:${agpVersion}")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
        classpath("com.google.gms:google-services:4.4.4")
    }
}

plugins {
    id "com.facebook.react.rootproject"
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url("https://www.jitpack.io") }
    }
}
