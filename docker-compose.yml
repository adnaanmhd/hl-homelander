services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: humyn-postgres
    environment:
      POSTGRES_USER: humyn
      POSTGRES_PASSWORD: humyn
      POSTGRES_DB: humyn_dev
    ports:
      - "5432:5432"
    volumes:
      - humyn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humyn -d humyn_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:4.0
    container_name: humyn-localstack
    environment:
      SERVICES: s3,secretsmanager
      DEBUG: 0
      DEFAULT_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
    volumes:
      - humyn-localstack-data:/var/lib/localstack
      # Init scripts auto-run after LocalStack reports ready
      - ./infra/localstack/init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:8.13
    container_name: humyn-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@humyn.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  humyn-postgres-data:
  humyn-localstack-data:
